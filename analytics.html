<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #0d0d1a 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #e0e0e0;
        }

        .dashboard-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 40px;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 140px);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: linear-gradient(145deg, #1e1e2f 0%, #16162a 100%);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.3), transparent);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 12px 40px rgba(0, 255, 136, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Main chart card - spans 2 columns and 2 rows */
        .main-chart {
            grid-column: 2 / 4;
            grid-row: 1 / 3;
        }

        .chart-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .chart-title {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .chart-svg {
            width: 100%;
            height: calc(100% - 40px);
        }

        /* Metric cards */
        .metric-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .metric-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 1.5rem;
        }

        .metric-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Uptime card */
        .uptime .metric-icon {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 200, 100, 0.1));
            color: #00ff88;
        }
        .uptime .metric-value {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Latency card */
        .latency .metric-icon {
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.2), rgba(0, 150, 200, 0.1));
            color: #00c8ff;
        }
        .latency .metric-value {
            background: linear-gradient(135deg, #00c8ff, #0099cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Users card */
        .users .metric-icon {
            background: linear-gradient(135deg, rgba(255, 136, 0, 0.2), rgba(200, 100, 0, 0.1));
            color: #ff8800;
        }
        .users .metric-value {
            background: linear-gradient(135deg, #ff8800, #cc6600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Requests card */
        .requests .metric-icon {
            background: linear-gradient(135deg, rgba(200, 0, 255, 0.2), rgba(150, 0, 200, 0.1));
            color: #c800ff;
        }
        .requests .metric-value {
            background: linear-gradient(135deg, #c800ff, #9900cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Errors card */
        .errors .metric-icon {
            background: linear-gradient(135deg, rgba(255, 60, 60, 0.2), rgba(200, 40, 40, 0.1));
            color: #ff3c3c;
        }
        .errors .metric-value {
            background: linear-gradient(135deg, #ff3c3c, #cc2020);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Storage card */
        .storage .metric-icon {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(200, 170, 0, 0.1));
            color: #ffd700;
        }
        .storage .metric-value {
            background: linear-gradient(135deg, #ffd700, #ccaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Glowing line effect */
        .glow-line {
            filter: drop-shadow(0 0 8px #00ff88) drop-shadow(0 0 20px rgba(0, 255, 136, 0.5));
        }

        /* Status indicator */
        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px #00ff88;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Grid lines for chart */
        .grid-line {
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 1;
        }

        /* Chart area gradient */
        .chart-area {
            fill: url(#areaGradient);
        }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: auto;
            }
            .main-chart {
                grid-column: 1 / 3;
                grid-row: auto;
                min-height: 280px;
            }
        }

        @media (max-width: 500px) {
            .bento-grid {
                grid-template-columns: 1fr;
            }
            .main-chart {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>
    <h1 class="dashboard-title">Analytics Dashboard</h1>
    
    <div class="bento-grid">
        <!-- Uptime Card -->
        <div class="card metric-card uptime">
            <div class="metric-icon">⬆</div>
            <span class="metric-label">Uptime</span>
            <span class="metric-value">99.9%</span>
        </div>

        <!-- Main Chart Card -->
        <div class="card main-chart">
            <div class="chart-container">
                <div class="chart-title"><span class="status-dot"></span>Traffic Overview - Last 24 Hours</div>
                <svg class="chart-svg" viewBox="0 0 500 200" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3" />
                            <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0" />
                        </linearGradient>
                        <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#00cc6a" />
                            <stop offset="50%" style="stop-color:#00ff88" />
                            <stop offset="100%" style="stop-color:#00ffaa" />
                        </linearGradient>
                    </defs>
                    
                    <!-- Grid lines -->
                    <line class="grid-line" x1="0" y1="40" x2="500" y2="40" />
                    <line class="grid-line" x1="0" y1="80" x2="500" y2="80" />
                    <line class="grid-line" x1="0" y1="120" x2="500" y2="120" />
                    <line class="grid-line" x1="0" y1="160" x2="500" y2="160" />
                    
                    <!-- Area under the line -->
                    <path class="chart-area" d="M0,180 L0,150 Q50,140 80,130 T160,110 T240,100 T320,80 T400,60 T500,30 L500,180 Z" />
                    
                    <!-- Main glowing line (trending upward) -->
                    <path 
                        class="glow-line"
                        d="M0,150 Q50,140 80,130 T160,110 T240,100 T320,80 T400,60 T500,30"
                        fill="none"
                        stroke="url(#lineGradient)"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    
                    <!-- Data points -->
                    <circle cx="0" cy="150" r="4" fill="#00ff88" class="glow-line" />
                    <circle cx="80" cy="130" r="4" fill="#00ff88" class="glow-line" />
                    <circle cx="160" cy="110" r="4" fill="#00ff88" class="glow-line" />
                    <circle cx="240" cy="100" r="4" fill="#00ff88" class="glow-line" />
                    <circle cx="320" cy="80" r="4" fill="#00ff88" class="glow-line" />
                    <circle cx="400" cy="60" r="4" fill="#00ff88" class="glow-line" />
                    <circle cx="500" cy="30" r="6" fill="#00ff88" class="glow-line" />
                </svg>
            </div>
        </div>

        <!-- Latency Card -->
        <div class="card metric-card latency">
            <div class="metric-icon">⚡</div>
            <span class="metric-label">Latency</span>
            <span class="metric-value">12ms</span>
        </div>

        <!-- Users Card -->
        <div class="card metric-card users">
            <div class="metric-icon">👥</div>
            <span class="metric-label">Users</span>
            <span class="metric-value">10k</span>
        </div>

        <!-- Requests Card -->
        <div class="card metric-card requests">
            <div class="metric-icon">📊</div>
            <span class="metric-label">Requests</span>
            <span class="metric-value">1.2M</span>
        </div>

        <!-- Errors Card -->
        <div class="card metric-card errors">
            <div class="metric-icon">⚠</div>
            <span class="metric-label">Errors</span>
            <span class="metric-value">0.1%</span>
        </div>

        <!-- Storage Card -->
        <div class="card metric-card storage">
            <div class="metric-icon">💾</div>
            <span class="metric-label">Storage</span>
            <span class="metric-value">85GB</span>
        </div>
    </div>

    <script>
        // Optional: Add subtle animation to the line chart
        document.addEventListener('DOMContentLoaded', function() {
            const line = document.querySelector('.glow-line[stroke-width="3"]');
            if (line) {
                const length = typeof line.getTotalLength === 'function' ? line.getTotalLength() : 1000;
                line.style.strokeDasharray = length;
                line.style.strokeDashoffset = length;
                line.style.animation = 'drawLine 2s ease-out forwards';
                
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes drawLine {
                        to {
                            stroke-dashoffset: 0;
                        }
                    }
                `;
                document.head.appendChild(style);
            }
        });
    </script>
</body>
</html>
