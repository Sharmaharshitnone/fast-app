<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
            min-height: 100vh;
            padding: 40px;
            color: #e6edf3;
        }

        .dashboard-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 40px;
            color: #e6edf3;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 200px);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: linear-gradient(145deg, #1a1f26 0%, #21262d 100%);
            border-radius: 16px;
            border: 1px solid rgba(48, 54, 61, 0.8);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.3), transparent);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(0, 255, 136, 0.1);
        }

        /* Central chart card - wide rectangle spanning 2 columns */
        .chart-card {
            grid-column: 2 / 4;
            grid-row: 1 / 3;
        }

        .chart-card canvas {
            width: 100%;
            height: 100%;
        }

        /* Metric cards - smaller squares */
        .metric-card {
            text-align: center;
        }

        .metric-label {
            font-size: 0.85rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff88 0%, #00d4aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
        }

        .metric-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: 8px;
            font-size: 0.75rem;
            color: #00ff88;
        }

        .metric-indicator.positive::before {
            content: '▲';
            font-size: 0.6rem;
        }

        .metric-indicator.negative {
            color: #ff6b6b;
        }

        .metric-indicator.negative::before {
            content: '▼';
            font-size: 0.6rem;
        }

        /* Status dot animation */
        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 10px #00ff88;
            }
            50% {
                opacity: 0.7;
                box-shadow: 0 0 20px #00ff88, 0 0 30px #00ff88;
            }
        }

        /* Chart title */
        .chart-title {
            position: absolute;
            top: 20px;
            left: 24px;
            font-size: 1rem;
            color: #8b949e;
            display: flex;
            align-items: center;
        }

        .chart-container {
            width: 100%;
            height: calc(100% - 40px);
            margin-top: 20px;
            position: relative;
        }

        /* Glow effect for chart */
        .chart-glow {
            position: absolute;
            bottom: 40%;
            left: 10%;
            right: 10%;
            height: 40%;
            background: radial-gradient(ellipse at center, rgba(0, 255, 136, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        @media (max-width: 900px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: auto;
            }
            
            .chart-card {
                grid-column: 1 / 3;
                grid-row: auto;
                min-height: 300px;
            }
        }

        @media (max-width: 500px) {
            .bento-grid {
                grid-template-columns: 1fr;
            }
            
            .chart-card {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>
    <h1 class="dashboard-title">Analytics Dashboard</h1>
    
    <div class="bento-grid">
        <!-- Top-left metric card -->
        <div class="card metric-card">
            <div class="metric-label">Uptime</div>
            <div class="metric-value">99.9%</div>
            <div class="metric-indicator positive">+0.1% from last month</div>
        </div>

        <!-- Central chart card (spans 2 columns and 2 rows) -->
        <div class="card chart-card">
            <div class="chart-title">
                <span class="status-dot"></span>
                Live Traffic Trends
            </div>
            <div class="chart-container">
                <div class="chart-glow"></div>
                <canvas id="lineChart"></canvas>
            </div>
        </div>

        <!-- Top-right metric card -->
        <div class="card metric-card">
            <div class="metric-label">Latency</div>
            <div class="metric-value">12ms</div>
            <div class="metric-indicator positive">-3ms from avg</div>
        </div>

        <!-- Bottom-left metric card -->
        <div class="card metric-card">
            <div class="metric-label">Users</div>
            <div class="metric-value">10k</div>
            <div class="metric-indicator positive">+12% this week</div>
        </div>

        <!-- Bottom-right metric card -->
        <div class="card metric-card">
            <div class="metric-label">Requests</div>
            <div class="metric-value">1.2M</div>
            <div class="metric-indicator positive">+8% today</div>
        </div>
    </div>

    <script>
        // Draw the line chart with glowing green line
        const canvas = document.getElementById('lineChart');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            drawChart();
        }

        function drawChart() {
            const width = canvas.width;
            const height = canvas.height;
            
            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Generate upward trending data points
            const points = [];
            const numPoints = 12;
            const padding = 40;
            const chartWidth = width - padding * 2;
            const chartHeight = height - padding * 2;
            
            for (let i = 0; i < numPoints; i++) {
                const x = padding + (i / (numPoints - 1)) * chartWidth;
                // Create an upward trend with some variation
                const trend = (i / (numPoints - 1)) * 0.6;
                const variation = Math.sin(i * 0.8) * 0.15 + Math.random() * 0.1;
                const y = height - padding - (trend + variation + 0.2) * chartHeight;
                points.push({ x, y });
            }
            
            // Draw grid lines
            ctx.strokeStyle = 'rgba(48, 54, 61, 0.5)';
            ctx.lineWidth = 1;
            
            // Horizontal grid lines
            for (let i = 0; i <= 4; i++) {
                const y = padding + (i / 4) * chartHeight;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(width - padding, y);
                ctx.stroke();
            }
            
            // Vertical grid lines
            for (let i = 0; i <= 6; i++) {
                const x = padding + (i / 6) * chartWidth;
                ctx.beginPath();
                ctx.moveTo(x, padding);
                ctx.lineTo(x, height - padding);
                ctx.stroke();
            }
            
            // Draw area fill with gradient
            const gradient = ctx.createLinearGradient(0, padding, 0, height - padding);
            gradient.addColorStop(0, 'rgba(0, 255, 136, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 255, 136, 0.02)');
            
            ctx.beginPath();
            ctx.moveTo(points[0].x, height - padding);
            points.forEach(point => {
                ctx.lineTo(point.x, point.y);
            });
            ctx.lineTo(points[points.length - 1].x, height - padding);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Draw the glowing line
            // Outer glow
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                const xc = (points[i].x + points[i - 1].x) / 2;
                const yc = (points[i].y + points[i - 1].y) / 2;
                ctx.quadraticCurveTo(points[i - 1].x, points[i - 1].y, xc, yc);
            }
            ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.3)';
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            
            // Middle glow
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                const xc = (points[i].x + points[i - 1].x) / 2;
                const yc = (points[i].y + points[i - 1].y) / 2;
                ctx.quadraticCurveTo(points[i - 1].x, points[i - 1].y, xc, yc);
            }
            ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.6)';
            ctx.lineWidth = 6;
            ctx.stroke();
            
            // Main line
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                const xc = (points[i].x + points[i - 1].x) / 2;
                const yc = (points[i].y + points[i - 1].y) / 2;
                ctx.quadraticCurveTo(points[i - 1].x, points[i - 1].y, xc, yc);
            }
            ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Draw data points
            points.forEach((point, index) => {
                // Outer glow
                ctx.beginPath();
                ctx.arc(point.x, point.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 255, 136, 0.2)';
                ctx.fill();
                
                // Inner point
                ctx.beginPath();
                ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#00ff88';
                ctx.fill();
                
                // White center
                ctx.beginPath();
                ctx.arc(point.x, point.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            });
            
            // Draw axis labels
            ctx.fillStyle = '#8b949e';
            ctx.font = '11px Segoe UI, sans-serif';
            
            // X-axis labels (months)
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            for (let i = 0; i < numPoints; i++) {
                const x = padding + (i / (numPoints - 1)) * chartWidth;
                ctx.textAlign = 'center';
                ctx.fillText(months[i], x, height - 15);
            }
            
            // Y-axis labels
            const yLabels = ['0', '25k', '50k', '75k', '100k'];
            for (let i = 0; i <= 4; i++) {
                const y = height - padding - (i / 4) * chartHeight;
                ctx.textAlign = 'right';
                ctx.fillText(yLabels[i], padding - 10, y + 4);
            }
        }
        
        // Initialize
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
</html>
