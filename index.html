<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Data Hero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #16082a 50%, #0d0518 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Neural Network Canvas Background */
        #neural-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Frosted Glass Card */
        .glass-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 60px 80px;
            text-align: center;
            box-shadow: 
                0 8px 32px rgba(138, 43, 226, 0.3),
                0 0 80px rgba(255, 0, 128, 0.1),
                inset 0 0 80px rgba(255, 255, 255, 0.02);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.5), rgba(255, 0, 128, 0.5), rgba(138, 43, 226, 0.5));
            border-radius: 26px;
            z-index: -1;
            opacity: 0.5;
            filter: blur(10px);
        }

        .user-name {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: #ffffff;
            margin-bottom: 16px;
            text-shadow: 0 0 40px rgba(255, 0, 128, 0.5);
        }

        .user-title {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            background: linear-gradient(90deg, #9b4dca, #ff0080, #9b4dca);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s ease-in-out infinite;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 200% center; }
        }

        /* Chat Section (below hero) */
        .chat-section {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-section h2 {
            color: #ffffff;
            font-weight: 300;
            margin-bottom: 20px;
            text-align: center;
        }

        #messages {
            height: 200px;
            overflow-y: scroll;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            color: #e0e0e0;
        }

        #messages p {
            margin: 8px 0;
            padding: 8px 12px;
            background: rgba(138, 43, 226, 0.2);
            border-radius: 8px;
            border-left: 3px solid #ff0080;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        #msgBox {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        #msgBox:focus {
            border-color: #ff0080;
        }

        #msgBox::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .chat-input button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #9b4dca, #ff0080);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 0, 128, 0.4);
        }
    </style>
</head>
<body>
    <!-- Hero Section with Neural Network Background -->
    <section class="hero">
        <canvas id="neural-canvas"></canvas>
        <div class="glass-card">
            <h1 class="user-name">Harshit Sharma</h1>
            <p class="user-title">Principal Engineer</p>
        </div>
    </section>

    <!-- Chat Section -->
    <section class="chat-section">
        <h2>WebSocket Chat</h2>
        <div id="messages"></div>
        <div class="chat-input">
            <input type="text" id="msgBox" placeholder="Type a message..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </section>

    <script>
        // Neural Network Animation
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');

        let nodes = [];
        let animationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initNodes();
        }

        function initNodes() {
            nodes = [];
            const nodeCount = Math.floor((canvas.width * canvas.height) / 15000);
            
            for (let i = 0; i < nodeCount; i++) {
                nodes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    radius: Math.random() * 2 + 1,
                    pulsePhase: Math.random() * Math.PI * 2
                });
            }
        }

        function drawNetwork() {
            ctx.fillStyle = 'rgba(13, 5, 24, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const time = Date.now() * 0.001;
            const connectionDistance = 150;

            // Draw connections
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        const opacity = (1 - distance / connectionDistance) * 0.6;
                        const pulse = Math.sin(time * 2 + i * 0.1) * 0.3 + 0.7;
                        
                        // Create gradient for the connection line
                        const gradient = ctx.createLinearGradient(
                            nodes[i].x, nodes[i].y,
                            nodes[j].x, nodes[j].y
                        );
                        gradient.addColorStop(0, `rgba(155, 77, 202, ${opacity * pulse})`);
                        gradient.addColorStop(0.5, `rgba(255, 0, 128, ${opacity * pulse})`);
                        gradient.addColorStop(1, `rgba(155, 77, 202, ${opacity * pulse})`);

                        ctx.beginPath();
                        ctx.strokeStyle = gradient;
                        ctx.lineWidth = opacity * 2;
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Draw and update nodes
            for (let node of nodes) {
                // Update position
                node.x += node.vx;
                node.y += node.vy;

                // Bounce off edges
                if (node.x < 0 || node.x > canvas.width) node.vx *= -1;
                if (node.y < 0 || node.y > canvas.height) node.vy *= -1;

                // Keep within bounds
                node.x = Math.max(0, Math.min(canvas.width, node.x));
                node.y = Math.max(0, Math.min(canvas.height, node.y));

                // Pulsing effect
                const pulse = Math.sin(time * 3 + node.pulsePhase) * 0.5 + 1;
                const currentRadius = node.radius * pulse;

                // Draw node glow
                const glowGradient = ctx.createRadialGradient(
                    node.x, node.y, 0,
                    node.x, node.y, currentRadius * 8
                );
                glowGradient.addColorStop(0, 'rgba(255, 0, 128, 0.8)');
                glowGradient.addColorStop(0.4, 'rgba(155, 77, 202, 0.3)');
                glowGradient.addColorStop(1, 'rgba(155, 77, 202, 0)');

                ctx.beginPath();
                ctx.fillStyle = glowGradient;
                ctx.arc(node.x, node.y, currentRadius * 8, 0, Math.PI * 2);
                ctx.fill();

                // Draw node core
                ctx.beginPath();
                ctx.fillStyle = '#ffffff';
                ctx.arc(node.x, node.y, currentRadius, 0, Math.PI * 2);
                ctx.fill();
            }

            animationId = requestAnimationFrame(drawNetwork);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawNetwork();

        // WebSocket Chat
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(`${protocol}://${window.location.host}`);

        ws.onmessage = (event) => {
            const messages = document.getElementById('messages');
            messages.innerHTML += `<p>${event.data}</p>`;
            messages.scrollTop = messages.scrollHeight;
        };

        function sendMessage() {
            const input = document.getElementById('msgBox');
            if (input.value.trim()) {
                ws.send(input.value);
                input.value = '';
            }
        }

        // Allow sending message with Enter key
        document.getElementById('msgBox').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
