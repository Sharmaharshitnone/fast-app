name: Deploy to Amazon EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            
            # --- CRITICAL FIX START ---
            # 1. Force load the user configuration (This initializes fnm)
            source $HOME/.bashrc
            
            # 2. If that fails, try to manually find fnm (Backup plan)
            if ! command -v npm &> /dev/null; then
              export PATH="/home/ubuntu/.local/share/fnm:$PATH"
              eval "`fnm env`"
            fi
            # --- CRITICAL FIX END ---

            cd /var/www/app
            
            # Debug: Verify we found it
            echo "Using Node: $(node -v)"
            echo "Using NPM: $(npm -v)"

            git config --global --add safe.directory /var/www/app
            git fetch --all
            git reset --hard origin/master
            
            npm install
            pm2 restart fast-app
